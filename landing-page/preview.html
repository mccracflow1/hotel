<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Preview — Hotel</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
    <p class="bg-amber-900/40 px-4 py-2 text-center text-sm text-amber-100">
      Vista previa — mismo script que <code>index.html</code>. Ajustá <code>API_BASE_URL</code> en consola:
      <code>window.API_BASE_URL='http://localhost:3000/api/v1'</code>
    </p>
    <!-- Copia estructura mínima de index: mismos ids que consume app.js -->
    <main>
      <section id="hero" class="mx-auto max-w-5xl px-4 py-8"></section>
      <section id="contact" class="border-t border-slate-800 px-4 py-8"></section>
      <section id="services" class="border-t border-slate-800 bg-slate-900/40 px-4 py-8"></section>
      <section id="plans" class="px-4 py-8"></section>
      <section id="gallery" class="border-t border-slate-800 bg-slate-900/40 px-4 py-8"></section>
      <section id="faq" class="px-4 py-8"></section>
      <section id="map" class="border-t border-slate-800 bg-slate-900/40 px-4 py-8"></section>
    </main>
    <footer id="footer" class="border-t border-slate-800 px-4 py-6 text-center text-sm text-slate-500"></footer>
    <script defer src="./app.js"></script>
  </body>
</html>
