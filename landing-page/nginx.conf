server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Proxy: llamadas al API desde la landing ───────────────────────────────
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Proxy: medios del backend ─────────────────────────────────────────────
    location /uploads/ {
        proxy_pass       http://backend:3000;
        proxy_set_header Host $host;
        expires          7d;
        add_header       Cache-Control "public";
    }

    # SEO: /planes/{slug} → plan.html (slug leído en plan-detail.js desde pathname)
    location ~ ^/planes/ {
        try_files /plan.html =404;
    }

    # CSP (009): descomentá y ajustá CDNs reales antes de producción
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.tailwindcss.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; img-src 'self' data: https:; connect-src 'self' https:; frame-src https://www.google.com https://www.youtube.com;";

    # ── Archivos estáticos ────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    gzip            on;
    gzip_types      text/plain text/css application/javascript text/html;
    gzip_min_length 1024;
}
